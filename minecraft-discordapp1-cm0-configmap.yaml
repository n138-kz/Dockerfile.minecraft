  main.py: "from logging import getLogger,config as logging_conf\nlogger_config = {}\nlogger_config['version'] = 1\nlogger_config['disable_existing_loggers'] = False\nlogger_config['formatters'] = {}\nlogger_config['formatters']['simple'] = {}\nlogger_config['formatters']['simple']['format'] = '%(asctime)s %(name)s:%(lineno)s %(funcName)s [%(levelname)s]: %(message)s'\nlogger_config['formatters']['simple']['format'] = '%(asctime)s %(levelname)s: %(message)s'\nlogger_config['handlers'] = {}\nlogger_config['handlers']['consoleHandler'] = {}\nlogger_config['handlers']['consoleHandler']['class'] = 'logging.StreamHandler'\nlogger_config['handlers']['consoleHandler']['level'] = 'INFO'\nlogger_config['handlers']['consoleHandler']['formatter'] = 'simple'\nlogger_config['handlers']['consoleHandler']['stream'] = 'ext://sys.stdout'\nlogger_config['handlers']['fileHandler'] = {}\nlogger_config['handlers']['fileHandler']['class'] = 'logging.FileHandler'\nlogger_config['handlers']['fileHandler']['level'] = 'DEBUG'\nlogger_config['handlers']['fileHandler']['formatter'] = 'simple'\nlogger_config['handlers']['fileHandler']['filename'] = '/log/custom/console.log'\nlogger_config['handlers']['discord'] = {}\nlogger_config['handlers']['discord']['class'] = 'logging.FileHandler'\nlogger_config['handlers']['discord']['level'] = 'DEBUG'\nlogger_config['handlers']['discord']['formatter'] = 'simple'\nlogger_config['handlers']['discord']['filename'] = '/log/custom/console.log'\nlogger_config['handlers']['discord.http'] = {}\nlogger_config['handlers']['discord.http']['class'] = 'logging.FileHandler'\nlogger_config['handlers']['discord.http']['level'] = 'DEBUG'\nlogger_config['handlers']['discord.http']['formatter'] = 'simple'\nlogger_config['handlers']['discord.http']['filename'] = '/log/custom/console.log'\nlogger_config['loggers'] = {}\nlogger_config['loggers']['__main__'] = {}\nlogger_config['loggers']['__main__']['level'] = 'DEBUG'\nlogger_config['loggers']['__main__']['handlers'] = ['consoleHandler', 'fileHandler']\nlogger_config['loggers']['__main__']['propagate'] = False\nlogger_config['loggers']['same_hierarchy'] = {}\nlogger_config['loggers']['same_hierarchy']['level'] = 'DEBUG'\nlogger_config['loggers']['same_hierarchy']['handlers'] = ['consoleHandler', 'fileHandler']\nlogger_config['loggers']['same_hierarchy']['propagate'] = False\nlogger_config['loggers']['lower.sub'] = {}\nlogger_config['loggers']['lower.sub']['level'] = 'DEBUG'\nlogger_config['loggers']['lower.sub']['handlers'] = ['consoleHandler', 'fileHandler']\nlogger_config['loggers']['lower.sub']['propagate'] = False\nlogger_config['root'] = {}\nlogger_config['root']['level'] = 'INFO'\nlogging_conf.dictConfig(logger_config)\nlogger = getLogger(__name__)\nlogger.info('Init')\n\nimport os,sys\nimport traceback\nimport discord\nimport datetime\nimport json\nimport fasteners\nfrom dotenv import load_dotenv\nfrom mcrcon import MCRcon\n\ndef file_put_contents(filepath: str = None, writedata: str = None):\n    if os.path.exists(filepath):\n        if not os.path.isfile(filepath):\n            raise FileExistsError\n        with fasteners.InterProcessLock(filepath):\n            logger.debug(f'Locked by {os.getpid()}')\n            with open(filepath, mode='w') as f:\n                f.write(writedata)\n        return True\n    else:\n        return False\n\nclass MyView(discord.ui.View):\n    def __init__(self, message: discord.Message, timeout: float=30.0):\n        # 30秒でタイムアウトするように設定\n        super().__init__(timeout=timeout)\n\n        # messageをインスタンス変数として保存\n        self.message = message\n\n    # タイムアウト時に呼び出される処理（この中に「消す」処理を書く）\n    async def on_timeout(self):\n        # このビューを削除するために、元のメッセージを編集する\n        # self.message には View がアタッチされたメッセージが自動で入ります\n        try:\n            # メッセージからビューを削除（または self.disable_all_items() で全て無効化）\n            await self.message.delete()\n        except discord.NotFound:\n            # メッセージが既に削除されていた場合は無視\n            pass\n        except Exception as e:\n            logger.debug(self)\n            logger.error(f'Error on {__name__}: {e}')\n\nlogger.info(f'Pwd: {os.getcwd()}')\n\nload_dotenv()\nTOKEN_DISCORD=os.getenv('TOKEN_DISCORD', '')\nif len(TOKEN_DISCORD) > 0:\n    logger.info('Load & set the token DISCORD')\nelse:\n    logger.error('Require the token.discord')\n    raise ValueError('Require the token.discord')\n\nCREDENTIAL_MCRCON={\n    'addr': os.getenv('ADDRESS_MCRCON', 'localhost'),\n    'port': os.getenv('PORTNUM_MCRCON', 25575),\n    'pass': os.getenv('PASSWORD_MCRCON', 'minecraft'),\n}\n\nFILES_CONFIG={\n    'discord-apps-config.json': os.getenv('FILES_CONFIG_DISCORD_APPS_CONFIG', 'discord-apps-config.json'),\n}\n\nintents = discord.Intents.default()\nintents.message_content = True\nintents.reactions = True\nintents.typing = True\nclient = discord.Client(intents=intents)\ntree = discord.app_commands.CommandTree(client)\n\ntemplate = {\n    \"color\": {\n        'success': 0x008000,\n        'failure': 0xFF0000,\n        'caution': 0xFFFF00,\n        'none': 0x000000,\n    },\n}\n\ntitle = ''\ndescription = ''\ncolor = template.get('color').get('none')\n\nconfiguration = {}\n\nlogger.info('Loading config files: {}'.format(\n    FILES_CONFIG['discord-apps-config.json'],\n))\nif os.path.exists(FILES_CONFIG['discord-apps-config.json']):\n    if not os.path.isfile(FILES_CONFIG['discord-apps-config.json']):\n        logger.error('Not File Exists')\n        raise FileExistsError\n    with open(FILES_CONFIG['discord-apps-config.json'], mode='r') as f:\n        try:\n            configuration |= {'discord-apps-config.json': json.load(f)}\n\n            logger.info('Loaded')\n            logger.debug(configuration.get('discord-apps-config.json'))\n        except json.JSONDecodeError as e:\n            logger.error(f'File Not Valid. Creating file from template. {e}')\n\n            configuration |= {'discord-apps-config.json': {}}\n            file_put_contents(FILES_CONFIG['discord-apps-config.json'], json.dumps({}))\nelse:\n    logger.warning('File Not Exists. Creating file from template.')\n\n    configuration |= {'discord-apps-config.json': {}}\n    file_put_contents(FILES_CONFIG['discord-apps-config.json'], json.dumps({}))\n\n@client.event\nasync def on_ready():\n    logger.info('Connect OK ID:{} NAME:{}'.format(client.user.id, client.user.name))\n    logger.info('Invite link: https://discord.com/oauth2/authorize?client_id={}'.format(client.user.id))\n\n    # アクティビティステータスを設定\n    await client.change_presence(\n        status=discord.Status.online,\n        activity=discord.CustomActivity(name=client.user.name)\n    )\n    logger.info('Change presence status to {}'.format(discord.Status.online))\n    logger.info('Change presence activity to {}'.format(discord.CustomActivity(name=client.user.name)))\n\n    # アクティビティステータスを設定\n    await client.change_presence(\n        status=discord.Status.online,\n        activity=discord.CustomActivity(name='/mcrcon:help')\n    )\n    logger.info('Change presence status to {}'.format(discord.Status.online))\n    logger.info('Change presence activity to {}'.format(discord.CustomActivity(name='/mcrcon:help')))\n\n    # スラッシュコマンドを同期\n    try:\n        await tree.sync()\n    except discord.HTTPException as e:\n        logger.warning(e)\n        logger.error(traceback.format_exc())\n    except discord.app_commands.CommandSyncFailure as e:\n        logger.warning(e)\n        logger.error(traceback.format_exc())\n    except discord.Forbidden as e:\n        logger.warning(e)\n        logger.error(traceback.format_exc())\n    except discord.MissingApplicationID as e:\n        logger.warning(e)\n        logger.error(traceback.format_exc())\n    except discord.app_commands.TranslationError as e:\n        logger.warning(e)\n        logger.error(traceback.format_exc())\n    logger.info('Synced slash commands.')\n\n    # レイテンシ測定\n    logger.info(f'Latency: {round(client.latency*1000)}ms')\n\n    # 起動完了\n    logger.info('Ready')\n\n@client.event\nasync def on_connect():\n    logger.info('Connected')\n\n@client.event\nasync def on_disconnect():\n    logger.warning('Disconnected')\n\n@client.event\nasync def on_resumed():\n    logger.info('resumed')\n\n@client.event\nasync def on_error(event, args, kwargs):\n    logger.error('on_error: {}'.format(\n        event,\n    ))\n    logger.error(sys.exc_info())\n\n@client.event\nasync def on_typing(channel, user, when):\n    logger.info('on_typing: channel:{} user:{} when:{}'.format(\n        channel.id,\n        user.id,\n        when,\n    ))\n\n@client.event\nasync def on_message_delete(message):\n    logger.info('on_message_delete')\n\n@client.event\nasync def on_bulk_message_delete(message):\n    logger.info('on_bulk_message_delete')\n\n@client.event\nasync def on_message_edit(before, after):\n    # 送信者が自分自身である場合は弾く\n    if after.author.id == client.user.id:\n        return\n    # 送信者がbotである場合は弾く\n    if after.author.bot:\n        logger.warning('Message author is BOT: {}({})'.format(\n            after.author.name,\n            after.author.id,\n        ))\n        return\n    # テキストチャンネルのみ処理\n    if after.channel.type != discord.ChannelType.text:\n        logger.warning('Channel type is not text channel')\n        return\n    # メッセージ受取り\n    logger.info('on_message_edit author: {}({}) guild:{} channel:{}'.format(\n        after.author.name,\n        after.author.id,\n        after.guild.id,\n        after.channel.id,\n    ))\n    logger.debug('on_message_edit author: {}({}) guild:{}({}) channel:{}({}) content:{}'.format(\n        after.author.name,\n        after.author.id,\n        after.guild.id,\n        after.guild.name,\n        after.channel.id,\n        after.channel.name,\n        after.content,\n    ))\n\n@client.event\nasync def on_message(message):\n    # 変数初期化\n    timeu=datetime.datetime.now(datetime.timezone.utc)\n    title=None\n    descr=None\n    color=template['color']['none']\n    url=None\n    text=None\n\n    # 送信者が自分自身である場合は弾く\n    if message.author.id == client.user.id:\n        return\n    # 送信者がbotである場合は弾く\n    if message.author.bot:\n        logger.warning('Message author is BOT: {}({})'.format(\n            message.author.name,\n            message.author.id,\n        ))\n        return\n    # テキストチャンネルのみ処理\n    if message.channel.type != discord.ChannelType.text:\n        logger.warning('Channel type is not text channel')\n        return\n\n@tree.command(name=\"bothelp\",description=\"コマンドヘルプを表示\")\nasync def help(ctx: discord.Interaction):\n    try:\n        logger.debug('Call from name:{}({}) command:{} on guild:{}({}) channel:{}({})'.format(\n            ctx.user.name,\n            ctx.user.id,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.guild.id,\n            ctx.channel.name,\n            ctx.channel.id,\n        ))\n        logger.info('Call from name:{} command:{} on guild:{} channel:{}'.format(\n            ctx.user.name,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.channel.name,\n        ))\n\n        try:\n            discord_ephemeral = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']['ephemeral']\n        except KeyError:\n            discord_ephemeral = True\n\n        title = 'Usage'\n        description = ''\n        description += '`/bothelp`\\n'\n        description += 'コマンドのヘルプを表示\\n'\n        description += '\\n'\n        description += '`/discord_config`\\n'\n        description += 'Discord連携設定の表示・変更\\n'\n        description += '\\n'\n        description += '`/ping`\\n'\n        description += 'レイテンシを計測\\n'\n        description += '\\n'\n        description += '---\\n'\n        description += '`/banlist`\\n'\n        description += 'サーバーのブラックリストを表示\\n'\n        description += '\\n'\n        description += '`/datapack`\\n'\n        description += '存在するデータパック、または有効化されているデータパックの一覧を表示\\n'\n        description += '\\n'\n        description += '`/help`\\n'\n        description += 'コマンドのヘルプを表示\\n'\n        description += '\\n'\n        description += '`/list`\\n'\n        description += '現在サーバーに接続しているプレイヤーのリストを表示\\n'\n        description += '\\n'\n        description += '`/say`\\n'\n        description += 'サーバー上のすべてのプレイヤーにメッセージを送信\\n'\n        description += '\\n'\n        description = description.strip()\n        color = template['color']['none']\n        logger.info(description)\n    except Exception as e:\n        title = 'Error'\n        description = ''.join(traceback.format_exc())\n        color = template['color']['failure']\n        logger.warning(e)\n        logger.error(description)\n    embed = discord.Embed(\n        title=title,\n        description=description,\n        timestamp=datetime.datetime.now(datetime.timezone.utc),\n        color=color\n    )\n    view = MyView(message=None)\n    await ctx.response.send_message(\n        embed=embed,\n        view=view,\n        ephemeral=discord_ephemeral#ephemeral=True→「これらはあなただけに表示されています」\n    )\n    original_message = await ctx.original_response()\n    view.message = original_message\n\n@tree.command(name=\"ping\", description=\"レイテンシを計測\")\nasync def ping(ctx: discord.Interaction):\n    try:\n        logger.debug('Call from name:{}({}) command:{} on guild:{}({}) channel:{}({})'.format(\n            ctx.user.name,\n            ctx.user.id,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.guild.id,\n            ctx.channel.name,\n            ctx.channel.id,\n        ))\n        logger.info('Call from name:{} command:{} on guild:{} channel:{}'.format(\n            ctx.user.name,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.channel.name,\n        ))\n\n        try:\n            discord_ephemeral = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']['ephemeral']\n        except KeyError:\n            discord_ephemeral = True\n\n        title = 'Latency'\n        description = f'Pong! {round(client.latency*1000)}ms'\n        description = description.strip()\n        color = template['color']['caution']\n        logger.info(description)\n    except Exception as e:\n        title = 'Error'\n        description = ''.join(traceback.format_exc())\n        color = template['color']['failure']\n        logger.warning(e)\n        logger.error(description)\n    embed = discord.Embed(\n        title=title,\n        description=description,\n        timestamp=datetime.datetime.now(datetime.timezone.utc),\n        color=color\n    )\n    view = MyView(message=None)\n    await ctx.response.send_message(\n        embed=embed,\n        view=view,\n        ephemeral=discord_ephemeral#ephemeral=True→「これらはあなただけに表示されています」\n    )\n    original_message = await ctx.original_response()\n    view.message = original_message\n\n@tree.command(name=\"discord_config\", description=\"Discordに関連する設定を表示・変更\")\n@discord.app_commands.describe(\n    args1=\"設定項目名\",\n    args2=\"設定値\",\n)\n@discord.app_commands.choices(args1=[\n    discord.app_commands.Choice(name='ephemeral', value='ephemeral'),\n])\n@discord.app_commands.choices(args2=[\n    discord.app_commands.Choice(name='true', value='true'),\n    discord.app_commands.Choice(name='false', value='false'),\n])\n\nasync def discord_config(ctx: discord.Interaction, args1: str = None, args2: str = None):\n    try:\n        logger.debug('Call from name:{}({}) command:{} on guild:{}({}) channel:{}({})'.format(\n            ctx.user.name,\n            ctx.user.id,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.guild.id,\n            ctx.channel.name,\n            ctx.channel.id,\n        ))\n        logger.info('Call from name:{} command:{} on guild:{} channel:{}'.format(\n            ctx.user.name,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.channel.name,\n        ))\n\n        result = None\n        try:\n            discord_ephemeral = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']['ephemeral']\n        except KeyError:\n            discord_ephemeral = True\n\n        try: \n            result = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']\n            logger.info('Load configuration.get({}).get({}).get({}).get({}).get({})'.format(\n                'discord-apps-config.json',\n                str(ctx.user.id),\n                str(ctx.guild.id),\n                str(ctx.channel.id),\n                'userPreferences',\n            ))\n        except KeyError:\n            # 1. ユーザー階層の確認と作成\n            if str(ctx.user.id) not in configuration['discord-apps-config.json']:\n                configuration['discord-apps-config.json'][str(ctx.user.id)] = {\n                    'name': ctx.user.name # ユーザー名も追加\n                }\n            user_config = configuration['discord-apps-config.json'][str(ctx.user.id)]\n\n            # 2. ギルド階層の確認と作成\n            if str(ctx.guild.id) not in user_config:\n                user_config[str(ctx.guild.id)] = {\n                    'name': ctx.guild.name # ギルド名も追加\n                }\n            guild_config = user_config[str(ctx.guild.id)]\n\n            # 3. チャンネル階層の確認と作成\n            if str(ctx.channel.id) not in guild_config:\n                guild_config[str(ctx.channel.id)] = {\n                    'name': ctx.channel.name # チャンネル名も追加\n                }\n            channel_config = guild_config[str(ctx.channel.id)]\n\n            # 4. userPreferences階層の作成/上書き（ここでは常に新しい設定で上書きする）\n            channel_config['userPreferences'] = {\n                'ephemeral': discord_ephemeral,\n            }\n\n            result = channel_config['userPreferences']\n            \n            logger.warning(f'KeyError: {traceback.print_stack(limit=1)}')\n            file_put_contents(FILES_CONFIG['discord-apps-config.json'], json.dumps(configuration['discord-apps-config.json'], indent=2))\n\n        if args1 is None and args2 is None:\n            result = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']\n        elif args1 is not None and args2 is None:\n            try:\n                result = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences'][args1]\n            except KeyError:\n                result = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences'][args1] = None\n                logger.warning(f'KeyError: {traceback.print_stack(limit=1)}')\n                file_put_contents(FILES_CONFIG['discord-apps-config.json'], json.dumps(configuration['discord-apps-config.json'], indent=2))\n        elif args1 is not None and args2 is not None:\n            try:\n                if args1 == '':\n                    pass\n                elif args1 == 'ephemeral':\n                    if False:\n                        pass\n                    elif args2.lower() == 'true'  or args2.lower() == 'on'  or args2.lower() == 'enable'  or args2.lower() == '1':\n                        args2 = True\n                    elif args2.lower() == 'false' or args2.lower() == 'off' or args2.lower() == 'disable' or args2.lower() == '0':\n                        args2 = False\n                    else:\n                        logger.error(f'args2 cannot be interpreted: {args1}/{args2}')\n                        raise ValueError(f'args2 cannot be interpreted: {args1}/{args2}')\n\n                configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences'][args1] = args2\n                result = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences'][args1]\n                file_put_contents(FILES_CONFIG['discord-apps-config.json'], json.dumps(configuration['discord-apps-config.json'], indent=2))\n            except Exception as e:\n                # - KeyError\n                # - ValueError\n                result = {'error': f'{e}'}\n                logger.warning(e)\n                logger.error(traceback.print_stack(limit=1))\n\n        title = 'Discord config'\n        description = ''\n        description += '```json\\n'\n        description += json.dumps(result, indent=2, ensure_ascii=False)\n        description += '\\n'\n        description += '```\\n'\n        description = description.strip()\n        color = template['color']['success']\n        logger.info(description)\n    except Exception as e:\n        title = 'Error'\n        description = ''.join(traceback.format_exc())\n        color = template['color']['failure']\n        logger.warning(e)\n        logger.error(description)\n    embed = discord.Embed(\n        title=title,\n        description=description,\n        timestamp=datetime.datetime.now(datetime.timezone.utc),\n        color=color\n    )\n    view = MyView(message=None)\n    await ctx.response.send_message(\n        embed=embed,\n        view=view,\n        ephemeral=discord_ephemeral#ephemeral=True→「これらはあなただけに表示されています」\n    )\n    original_message = await ctx.original_response()\n    view.message = original_message\n\n@tree.command(name=\"help\", description=\"コマンドのヘルプを表示\")\nasync def mcrcon_help(ctx: discord.Interaction):\n    try:\n        logger.debug('Call from name:{}({}) command:{} on guild:{}({}) channel:{}({})'.format(\n            ctx.user.name,\n            ctx.user.id,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.guild.id,\n            ctx.channel.name,\n            ctx.channel.id,\n        ))\n        logger.info('Call from name:{} command:{} on guild:{} channel:{}'.format(\n            ctx.user.name,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.channel.name,\n        ))\n\n        result = None\n        try:\n            discord_ephemeral = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']['ephemeral']\n        except KeyError:\n            discord_ephemeral = True\n\n        try:\n            CREDENTIAL_MCRCON['port']=int(CREDENTIAL_MCRCON['port'])\n            with MCRcon(\n                CREDENTIAL_MCRCON['addr'],\n                CREDENTIAL_MCRCON['pass'],\n                CREDENTIAL_MCRCON['port']\n            ) as mcr:\n                result = mcr.command('{}'.format(' '.join([\n                    ctx.command.name,\n                ])))\n            title = '[mcrcon] Result: /{}'.format(' '.join([\n                ctx.command.name,\n            ]))\n            color = template['color']['success']\n            logger.info(result)\n        except Exception as e:\n            title = '[mcrcon] Error Result: /{}'.format(' '.join([\n                ctx.command.name,\n            ]))\n            result = ''.join(traceback.format_exc())\n            color = template['color']['failure']\n            logger.warning(e)\n            logger.error(result)\n        result = result.replace('/', '\\n/')\n        result = '\\n'.join(sorted([line.strip() for line in result.splitlines()]))\n\n        description = ''\n        description += '```\\n'\n        description += result\n        description += '\\n'\n        description += '```\\n'\n        description = description.strip()\n    except Exception as e:\n        title = 'Error'\n        description = ''.join(traceback.format_exc())\n        color = template['color']['failure']\n        logger.warning(e)\n        logger.error(description)\n\n    embed = discord.Embed(\n        title=title,\n        description=description,\n        timestamp=datetime.datetime.now(datetime.timezone.utc),\n        color=color\n    )\n    view = MyView(message=None)\n    await ctx.response.send_message(\n        embed=embed,\n        view=view,\n        ephemeral=discord_ephemeral#ephemeral=True→「これらはあなただけに表示されています」\n    )\n    original_message = await ctx.original_response()\n    view.message = original_message\n\n@tree.command(name=\"list\", description=\"現在サーバーに接続しているプレイヤーのリストを表示\")\n@discord.app_commands.describe(\n    args1=\"SUB COMMAND\",\n    args2=\"SUB COMMAND\",\n)\n@discord.app_commands.choices(args1=[\n    discord.app_commands.Choice(name='help', value='help'),\n    discord.app_commands.Choice(name='log', value='log'),\n])\n@discord.app_commands.choices(args2=[\n    discord.app_commands.Choice(name='help', value='help'),\n    discord.app_commands.Choice(name='login', value='login'),\n])\nasync def mcrcon_list(ctx: discord.Interaction, args1: str = None, args2: str = None):\n    try:\n        logger.debug('Call from name:{}({}) command:{} on guild:{}({}) channel:{}({})'.format(\n            ctx.user.name,\n            ctx.user.id,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.guild.id,\n            ctx.channel.name,\n            ctx.channel.id,\n        ))\n        logger.info('Call from name:{} command:{} on guild:{} channel:{}'.format(\n            ctx.user.name,\n            ctx.command.name,\n            ctx.guild.name,\n            ctx.channel.name,\n        ))\n\n        result = None\n        try:\n            discord_ephemeral = configuration['discord-apps-config.json'][str(ctx.user.id)][str(ctx.guild.id)][str(ctx.channel.id)]['userPreferences']['ephemeral']\n        except KeyError:\n            discord_ephemeral = True\n\n        logger.debug('args1: {}({}), args2: {}({})'.format(\n            args1, type(args1),\n            args2, type(args2),\n        ))\n        if args1 is None and args2 is None:\n            try:\n                CREDENTIAL_MCRCON['port']=int(CREDENTIAL_MCRCON['port'])\n                with MCRcon(\n                    CREDENTIAL_MCRCON['addr'],\n                    CREDENTIAL_MCRCON['pass'],\n                    CREDENTIAL_MCRCON['port']\n                ) as mcr:\n                    result = mcr.command('{}'.format(' '.join([\n                        ctx.command.name,\n                    ])))\n                title = '[mcrcon] Result: /{}'.format(' '.join([\n                    ctx.command.name,\n                ]))\n                color = template['color']['success']\n                logger.info(result)\n            except Exception as e:\n                title = '[mcrcon] Error Result: /{}'.format(' '.join([\n                    ctx.command.name,\n                ]))\n                result = ''.join(traceback.format_exc())\n                color = template['color']['failure']\n                logger.warning(e)\n                logger.error(result)\n            result = result.replace(':', ':\\n')\n            result = '\\n'.join([line.strip() for line in result.splitlines()])\n        elif ((args1 is not None) and (args2 is None)) or ((args1 is None) and (args2 is not None)):\n            # args1, args2 どちらか None\n            title = 'Error'\n            color = template['color']['failure']\n            result = ''\n            result += 'incomplete the command\\n'\n            result += f'/{ctx.command.name} args1:help args2:help\\n'\n            logger.warning(result)\n        else:\n            args1 = '' if args1 is None else args1\n            args2 = '' if args2 is None else args2\n            title = 'Result: /{} args1:{} args2:{}'.format(\n                ctx.command.name,\n                args1,\n                args2,\n            )\n            color = template['color']['none']\n            result = ''\n\n            if False:\n                pass\n            elif args1 == 'help':\n                logger.info(f'sub command: /{ctx.command.name} args1:{args1} args2:{args2}')\n                color = template['color']['success']\n                result += 'Usage(Help command)\\n'\n                result += f'/{ctx.command.name} args1:help args2:help\\n'\n                result += 'Print the this help.\\n'\n                result += '\\n'\n                result += f'/{ctx.command.name} args1:log args2:help\\n'\n                result += 'Print the logfile.\\n'\n                logger.info(result)\n            elif args1 == 'log':\n                if False:\n                    pass\n                elif args2 == 'help':\n                    logger.info(f'sub command: /{ctx.command.name} args1:{args1} args2:{args2}')\n                    color = template['color']['success']\n                    result += 'Usage(Help command)\\n'\n                    result += f'/{ctx.command.name} args1:{args1} args2:help\\n'\n                    result += 'Print the this help.\\n'\n                    result += '\\n'\n                    result += f'/{ctx.command.name} args1:{args1} args2:login\\n'\n                    result += 'Print the join/left history.\\n'\n                    result += '\\n'\n                    color = template['color']['success']\n                    logger.info(result)\n                elif args2 == 'login':\n                    logger.info(f'sub command: /{ctx.command.name} args1:{args1} args2:{args2}')\n                    color = template['color']['success']\n                    path = '/log/custom/latest.log'\n                    with open(path) as f:\n                        lines = f.readlines()\n                        lines = [line.strip() for line in lines]\n                        lines = [line for line in lines if ('joined the game' in line) or ('left the game' in line)]\n                        if len(lines) > 0:\n                            result += '>>>\\n'\n                            for line in lines:\n                                line = line.split(maxsplit=3)\n                                line = f'{line[0]}: {line[3]}'\n                                result += line + '\\n'\n                            result += '<<<\\n'\n                    